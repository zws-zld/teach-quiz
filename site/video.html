<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#1652d4">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>视频课堂 · 教师编刷题系统</title>
<style>
:root{
  --bg:#f4f7fc;--surface:#fff;--surface-2:#f8faff;
  --ink:#16233a;--ink-2:#3c4a63;--muted:#7a889f;--line:#e6ecf5;--line-2:#d7e0ee;
  --brand:#1652d4;--brand-deep:#0f3fa8;--brand-soft:#eaf1ff;--brand-line:#cfe0ff;
  --ok:#0e9f6e;--ok-soft:#e6f7f0;--warn:#b8790a;--warn-soft:#fff5e2;
  --shadow-1:0 1px 3px rgba(16,36,71,.04),0 1px 2px rgba(16,36,71,.03);
  --shadow-2:0 8px 26px rgba(16,36,71,.1);
  --r-sm:9px;--r-md:14px;--r-lg:20px;--ease:cubic-bezier(.16,1,.3,1);
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.topbar{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;padding:20px 20px 26px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.topbar::after{content:"";position:absolute;top:-50px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.topbar .tb-in{max-width:720px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:21px;font-weight:800;letter-spacing:.3px}
.topbar p{font-size:12px;opacity:.82;margin-top:4px}
.topbar .back{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px}
.notice{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px;padding:12px 15px;font-size:12px;color:var(--ink-2);line-height:1.75;margin-bottom:18px}
.notice b{color:var(--brand)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs .t{flex:1;text-align:center;padding:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:11px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.18s}
.tabs .t.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(22,82,212,.22)}
.sec-title{font-size:15px;font-weight:800;margin:6px 2px 13px;display:flex;align-items:center;gap:8px}
.sec-title .bar{width:4px;height:17px;background:var(--brand);border-radius:3px}
.kp-filter{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kp-filter::-webkit-scrollbar{display:none}
.kp-filter .chip{flex-shrink:0;padding:7px 13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap;cursor:pointer;transition:.16s}
.kp-filter .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.plat-filter{padding-bottom:10px;align-items:center}
.plat-filter .chip{display:inline-flex;align-items:center;gap:6px}
.plat-filter .chip .cnt{font-size:10px;background:rgba(22,82,212,.1);color:var(--brand);border-radius:8px;padding:1px 6px;font-weight:800;line-height:1.3}
.plat-filter .chip.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-1);cursor:pointer;transition:.22s var(--ease)}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--brand-line)}
.vcard .cover{position:relative;width:100%;aspect-ratio:16/9;background:#eef2f8;overflow:hidden}
.vcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .cover .badge{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;color:#fff;backdrop-filter:blur(4px)}
.vcard .cover .badge.jz{background:rgba(22,82,212,.88)}
.vcard .cover .badge.ls{background:rgba(14,159,110,.9)}
.vcard .cover .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.vcard .cover .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
.vcard .body{padding:13px 14px 15px}
.vcard .vt{font-size:13.5px;font-weight:750;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.vcard .va{font-size:11px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px}
.vcard .vk{font-size:10.5px;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:3px 8px;margin-top:9px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .pf{font-size:10px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:4px}
.vcard .pf b{font-weight:600;color:var(--brand)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px rgba(20,45,100,.05)}
.tabbar .tab{flex:1;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;padding:5px 0;font-weight:600}
.tabbar .tab .ti{display:block;font-size:19px;line-height:1.2;margin-bottom:2px}
.tabbar .tab.on{color:var(--brand)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.video-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar"><div class="tb-in">
  <div><h1>🎬 视频课堂</h1><p>知识点配套讲解 · 真实公开视频</p></div>
  <button class="back" onclick="location.href='index.html'+location.search">返回首页</button>
</div></div>
<div class="wrap">
  <div class="notice">📌 这里的课程来自 <b>B站、中国大学MOOC、国家智慧教育平台、国家教育行政学院</b> 等公开平台——B站视频经官方接口校验，慕课课程页均已核验可访问，绝不编造。封面已下载到本地避免失效。点卡片进入详情页，可看信息、知识点总结与图片预览，底部按钮跳转原站观看。</div>
  <div class="tabs">
    <div class="t on" data-s="all" onclick="setSubject('all')">全部</div>
    <div class="t" data-s="教综" onclick="setSubject('教综')">教育综合</div>
    <div class="t" data-s="历史" onclick="setSubject('历史')">历史学科</div>
  </div>
  <div class="sec-title" style="margin-top:2px"><span class="bar"></span>按平台筛选</div>
  <div id="platformFilter" class="kp-filter plat-filter"></div>
  <div id="kpFilter" class="kp-filter"></div>
  <div id="videoList" class="video-grid"></div>
</div>
<nav class="tabbar">
  <div class="tab" onclick="location.href='index.html'+location.search"><span class="ti">🏠</span>今日</div>
  <div class="tab" onclick="location.href='unit.html'+location.search"><span class="ti">🎓</span>考试</div>
  <div class="tab on"><span class="ti">🎬</span>视频</div>
  <div class="tab" onclick="location.href='index.html?p=mine'+location.search.replace('?','&')"><span class="ti">📊</span>我的</div>
</nav>
<div class="toast" id="toast"></div>
<script src="video-data.js"></script>
<script>
const VIDEOS=(window.VIDEO_DATA||[]);
let curSubject='all',curKp='all',curPlatform='all';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function setSubject(s){
  curSubject=s;curKp='all';curPlatform='all';
  document.querySelectorAll('.tabs .t').forEach(x=>x.classList.toggle('on',x.dataset.s===s));
  renderPlatformFilter();renderFilter();renderList();
}
function renderFilter(){
  let kps=[...new Set(VIDEOS.filter(v=>(curSubject==='all'||v.subject===curSubject)&&(curPlatform==='all'||(v.platform||'B站')===curPlatform)).flatMap(v=>v.kps))];
  const box=document.getElementById('kpFilter');
  box.innerHTML='<div class="chip'+(curKp==='all'?' on':'')+'" onclick="setKp(\'all\')">全部知识点</div>'+
    kps.map(k=>'<div class="chip'+(curKp===k?' on':'')+'" onclick="setKp(\''+k.replace(/'/g,"\\'")+'\')">'+esc(k)+'</div>').join('');
}
function setKp(k){curKp=k;renderFilter();renderList();}
function renderPlatformFilter(){
  const base=VIDEOS.filter(v=>curSubject==='all'||v.subject===curSubject);
  const plats=[...new Set(base.map(v=>v.platform||'B站'))];
  const box=document.getElementById('platformFilter');
  box.innerHTML='<div class="chip'+(curPlatform==='all'?' on':'')+'" onclick="setPlatform(\'all\')">全部平台</div>'+
    plats.map(p=>'<div class="chip'+(curPlatform===p?' on':'')+'" onclick="setPlatform(\''+p.replace(/'/g,"\\'")+'\')">'+esc(p)+'<span class="cnt">'+base.filter(v=>(v.platform||'B站')===p).length+'</span></div>').join('');
}
function setPlatform(p){curPlatform=p;curKp='all';renderPlatformFilter();renderFilter();renderList();}
function renderList(){
  let list=VIDEOS.filter(v=>(curSubject==='all'||v.subject===curSubject)&&(curPlatform==='all'||(v.platform||'B站')===curPlatform)&&(curKp==='all'||v.kps.includes(curKp)));
  const box=document.getElementById('videoList');
  if(!list.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0">当前筛选条件下暂无配套课程，换个平台或知识点试试</div>';return;}
  box.innerHTML=list.map(v=>`
    <div class="vcard" onclick="openDetail(${VIDEOS.indexOf(v)})">
      <div class="cover">
        <img src="${esc(v.cover)}" alt="${esc(v.title)}" loading="lazy" onerror="this.style.background='#dbe4f2';this.removeAttribute('src')">
        <span class="badge ${v.subject==='历史'?'ls':'jz'}">${v.subject==='历史'?'历史':'教综'}</span>
        <span class="play"></span>
      </div>
      <div class="body">
        <div class="vt">${esc(v.title)}</div>
        <div class="va">👤 ${esc(v.author)}</div>
        <div class="vk">📖 ${esc(v.kps[0]||'综合')}${v.kps.length>1?' 等'+v.kps.length+'个知识点':''}</div>
        <div class="pf">🏛 平台 <b>${esc(v.platform||'B站')}</b> · ${esc(v.ptype||'视频')}</div>
      </div>
    </div>`).join('');
}
function openDetail(i){location.href='vdetail.html?i='+i+location.search.replace('?','&');}
renderPlatformFilter();renderFilter();renderList();
</script>
</body>
</html>
