<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1652d4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>单元练习 · 教师编刷题系统</title>
<style>
.q-fig{margin:10px 0 16px;padding:10px;background:var(--surface-2,#f6f8fc);border:1px solid var(--line);border-radius:12px;text-align:center}
.q-fig img{max-width:100%;max-height:340px;border-radius:8px;display:block;margin:0 auto;cursor:zoom-in;box-shadow:0 2px 10px rgba(20,50,90,.08)}
.q-fig.sm{padding:4px;margin:6px 0}
.q-fig.sm img{max-height:90px}
.q-fig figcaption{font-size:11px;color:var(--muted);margin-top:7px}
.q-fig figcaption span{color:var(--brand);margin-left:6px}
.q-fig-light{position:fixed;inset:0;z-index:9999;background:rgba(8,15,30,.9);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.q-fig-light.show{display:flex}
.q-fig-light img{max-width:100%;max-height:92vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
:root{
  --bg:#f4f7fc; --surface:#ffffff; --surface-2:#f8faff;
  --ink:#16233a; --ink-2:#3c4a63; --muted:#7a889f;
  --line:#e6ecf5; --line-2:#d7e0ee;
  --brand:#1652d4; --brand-deep:#0f3fa8; --brand-soft:#eaf1ff; --brand-line:#cfe0ff;
  --sidebar:#0f2447; --sidebar-2:#183259; --sidebar-line:rgba(255,255,255,.09);
  --ok:#0e9f6e; --ok-soft:#e6f7f0; --err:#d64550; --err-soft:#fdecee;
  --warn:#b8790a; --warn-soft:#fff5e2;
  --shadow-1:0 1px 3px rgba(16,36,71,.04),0 1px 2px rgba(16,36,71,.03);
  --shadow-2:0 6px 20px rgba(16,36,71,.07);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.app{display:flex;min-height:100vh}
.sidebar{width:272px;flex:none;background:var(--sidebar);color:#c4d2e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sb-head{padding:22px 20px 16px;border-bottom:1px solid var(--sidebar-line)}
.sb-head h1{font-size:17px;color:#fff;font-weight:800;letter-spacing:-.01em}
.sb-head .sub{font-size:11.5px;color:#8fa4c4;margin-top:4px}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-gtitle{font-size:11px;color:#7f96ba;font-weight:700;padding:12px 10px 7px;letter-spacing:.06em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:#c4d2e8;
  padding:10px 11px;border-radius:9px;cursor:pointer;font-size:13px;text-align:left;transition:.16s var(--ease);margin-bottom:2px}
.nav-item:hover{background:var(--sidebar-2);color:#fff}
.nav-item.active{background:linear-gradient(90deg,#1d47a0,#1a3f8f);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.nav-item .ni-ic{width:26px;height:26px;flex:none;border-radius:7px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;font-size:13px}
.nav-item.active .ni-ic{background:rgba(255,255,255,.18)}
.nav-item .ni-name{flex:1;line-height:1.3}
.nav-item .ni-num{font-size:11px;font-family:monospace;color:#8fa4c4;background:rgba(255,255,255,.07);padding:1px 7px;border-radius:6px}
.nav-item.active .ni-num{color:#dbe7ff;background:rgba(255,255,255,.16)}
.sb-foot{padding:12px 14px 16px;border-top:1px solid var(--sidebar-line);font-size:11.5px;color:#7f96ba}
.sb-foot a{color:#a9c0e6;text-decoration:none}
.sb-links{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sb-links a{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.05);color:#c4d2e8;text-decoration:none;font-size:12.5px;transition:.16s}
.sb-links a:hover{background:rgba(255,255,255,.12);color:#fff}
.main{flex:1;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink)}
.crumb{font-size:13.5px;color:var(--muted);flex:1}
.crumb b{color:var(--ink)}
.content{max-width:960px;margin:0 auto;padding:28px 24px 100px}
.hero{background:linear-gradient(135deg,#1652d4,#2f6fd0);color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:24px;box-shadow:0 10px 30px rgba(22,82,212,.22)}
.hero h2{font-size:24px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.hero p{font-size:13.5px;opacity:.92;line-height:1.7;max-width:640px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:30px}
.unit-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-1);cursor:pointer;transition:.2s var(--ease);position:relative;overflow:hidden}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--brand-line)}
.unit-card .uc-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.uc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.uc-jz{background:var(--brand-soft);color:var(--brand)}
.uc-ls{background:#eaf7f0;color:#0e9f6e}
.uc-title{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.3}
.uc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.uc-meta{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.uc-meta b{font-family:monospace;font-size:14px;color:var(--brand);font-weight:800}
.uc-big{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--warn-soft);color:var(--warn);margin-top:10px}
.uc-go{position:absolute;right:20px;bottom:20px;color:var(--brand);font-size:13px;font-weight:700}
.section-title{font-size:16px;font-weight:800;color:var(--ink);margin:8px 0 16px;display:flex;align-items:center;gap:8px}
.section-title .st-line{width:4px;height:17px;background:var(--brand);border-radius:3px}
/* 答题区 */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow-1)}
.setup h3{font-size:18px;margin-bottom:6px}
.setup .desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.opt-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;cursor:pointer;transition:.16s}
.opt-row:hover{border-color:var(--brand-line);background:var(--surface-2)}
.opt-row.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt-row input{margin:0;accent-color:var(--brand)}
.opt-row .ot{font-size:13.5px;flex:1}
.setup-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:12px 24px;font-size:13.5px;font-weight:800;cursor:pointer;transition:.18s var(--ease);font-family:var(--font)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(22,82,212,.25)}
.btn.primary:hover{background:var(--brand-deep);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.quiz-head .qh-title{font-size:17px;font-weight:800}
.timer{font-family:monospace;font-size:14px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:6px 13px;border-radius:8px}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-1)}
.q-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:16px}
.q-num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:monospace}
.q-type{flex:none;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:#eef2f8;color:var(--ink-2);margin-top:3px}
.q-type.big{background:var(--warn-soft);color:var(--warn)}
.q-text{font-size:14.5px;line-height:1.7;color:var(--ink);font-weight:600;flex:1}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:.16s;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--brand-line);background:var(--surface-2)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.big-answer{width:100%;min-height:120px;border:1px solid var(--line-2);border-radius:10px;padding:13px 15px;font-size:13.5px;font-family:var(--font);line-height:1.7;resize:vertical;color:var(--ink)}
.big-answer:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.big-hint{font-size:11.5px;color:var(--muted);margin-top:7px}
.ansbox{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:14px}
.ansbox .row{font-size:12.8px;line-height:1.75;margin-bottom:9px}
.ansbox .lbl{display:inline-block;font-weight:800;color:var(--brand);margin-right:6px}
.ansbox .ref{background:var(--surface-2);border-radius:9px;padding:12px 14px;color:var(--ink-2)}
.ansbox .ref.mn{background:var(--warn-soft)}
.self-grade{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.self-grade .sg-lbl{font-size:12px;color:var(--muted);margin-right:4px}
.sg-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-2);transition:.16s}
.sg-btn:hover{border-color:var(--brand)}
.sg-btn.g1.sel{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.sg-btn.g2.sel{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.sg-btn.g3.sel{background:var(--err-soft);color:var(--err);border-color:var(--err)}
.submit-bar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 20px;box-shadow:var(--shadow-2);display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:8px;flex-wrap:wrap}
.submit-bar .info{font-size:13px;color:var(--ink-2)}
.submit-bar .info b{color:var(--brand);font-family:monospace;font-size:15px}
.result-hero{background:linear-gradient(135deg,#0f9f6e,#16b07b);color:#fff;border-radius:18px;padding:30px;text-align:center;margin-bottom:22px}
.result-hero .score{font-size:52px;font-weight:800;font-family:monospace;line-height:1}
.result-hero .score small{font-size:18px;opacity:.85}
.result-hero .msg{font-size:14px;margin-top:10px;opacity:.95}
.result-stats{display:flex;justify-content:center;gap:34px;margin-top:18px;font-size:13px}
.result-stats b{font-size:20px;font-family:monospace;display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,36,71,.42);z-index:40}
.overlay.show{display:block}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;width:84vw;max-width:310px;transform:translateX(-100%);transition:.24s var(--ease);z-index:50}
  .sidebar.show{transform:none}
  .menu-btn{display:block}
  .content{padding:18px 14px 90px}
  .hero{padding:22px 20px}
  .hero h2{font-size:20px}
  .topbar{padding:12px 14px}
  .unit-grid{grid-template-columns:1fr}
  .q-card{padding:17px 15px}
  .result-stats{gap:20px}
}
/* ================= 考试中心 v1 ================= */
.exam-hero{background:linear-gradient(135deg,#172e6e 0%,#1e40af 52%,#2563eb 100%);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:22px;box-shadow:0 12px 32px rgba(20,45,100,.22);position:relative;overflow:hidden}
.exam-hero::after{content:"";position:absolute;top:-70px;right:-50px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.exam-hero h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-bottom:7px}
.exam-hero p{font-size:13px;opacity:.9;line-height:1.75;max-width:660px;position:relative;z-index:1}
.exam-hero .eh-badge{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:4px 11px;border-radius:20px;margin-bottom:12px}
.exam-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:12px}
.exam-mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;transition:.22s var(--ease);position:relative;overflow:hidden;box-shadow:var(--shadow-1)}
.exam-mode:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:var(--brand-line)}
.exam-mode .em-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.exam-mode .em-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.exam-mode.m-small .em-ic{background:var(--brand-soft);color:var(--brand)}
.exam-mode.m-big .em-ic{background:var(--warn-soft);color:var(--warn)}
.exam-mode.m-real .em-ic{background:var(--err-soft);color:var(--err)}
.exam-mode .em-name{font-size:16px;font-weight:800;color:var(--ink)}
.exam-mode .em-tag{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.exam-mode .em-desc{font-size:12.5px;color:var(--ink-2);line-height:1.7;min-height:62px}
.exam-mode .em-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.exam-mode .em-meta span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.exam-mode .em-go{margin-top:14px;font-size:12.5px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:5px}
.exam-mode.m-real{border-color:#f3c9cd;background:linear-gradient(180deg,#fff 0,#fff6f6 100%)}
.exam-mode.m-real .em-go{color:var(--err)}
.exam-history{margin-top:22px}
.exam-hist-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:9px}
.exam-hist-row .ehr-score{font-family:monospace;font-size:20px;font-weight:800;color:var(--brand);min-width:58px}
.exam-hist-row .ehr-info{flex:1;min-width:0}
.exam-hist-row .ehr-info b{font-size:13px;display:block}
.exam-hist-row .ehr-info span{font-size:11.5px;color:var(--muted)}
.exam-hist-row .ehr-date{font-size:11px;color:var(--muted)}
/* 考试答题：考试模式顶部条 */
.exam-bar{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;border-radius:14px;padding:15px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:sticky;top:64px;z-index:9;box-shadow:0 8px 22px rgba(20,45,100,.18)}
.exam-bar .eb-title{font-size:15px;font-weight:800}
.exam-bar .eb-sub{font-size:11.5px;opacity:.8;margin-top:2px}
.exam-bar .eb-timer{font-family:monospace;font-size:19px;font-weight:800;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:7px 15px;border-radius:10px}
.exam-bar .eb-timer.warn{background:var(--err);border-color:var(--err);animation:ebPulse 1s infinite}
@keyframes ebPulse{50%{opacity:.65}}
/* 答题卡 */
.answer-sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.answer-sheet h4{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.answer-sheet h4 small{font-weight:500;color:var(--muted);font-size:11px}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.as-num{aspect-ratio:1;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
.as-num:hover{border-color:var(--brand)}
.as-num.answered{background:var(--brand);border-color:var(--brand);color:#fff}
.as-num.big{background:var(--warn-soft);border-color:#f0d491;color:var(--warn)}
.as-num.big.answered{background:var(--warn);border-color:var(--warn);color:#fff}
.as-legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.as-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 报告分析 */
.report-hero{border-radius:18px;padding:30px;color:#fff;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.report-hero.good{background:linear-gradient(135deg,#0f9f6e,#16b07b)}
.report-hero.mid{background:linear-gradient(135deg,#b45309,#d97706)}
.report-hero.bad{background:linear-gradient(135deg,#b91c1c,#dc2626)}
.report-hero::after{content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.report-hero .rh-label{font-size:12px;opacity:.85;letter-spacing:2px}
.report-hero .rh-score{font-size:56px;font-weight:800;font-family:monospace;line-height:1.1}
.report-hero .rh-score small{font-size:18px;opacity:.85}
.report-hero .rh-msg{font-size:14px;opacity:.95;margin-top:8px}
.report-hero .rh-stats{display:flex;justify-content:center;gap:30px;margin-top:18px;font-size:12px;flex-wrap:wrap}
.report-hero .rh-stats b{font-size:19px;font-family:monospace;display:block}
/* 上岸概率卡 */
.land-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-1)}
.land-card h3{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.land-card .lc-sub{font-size:11.5px;color:var(--muted);margin-bottom:18px}
.land-main{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.land-ring{position:relative;width:132px;height:132px;flex:none}
.land-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.land-ring .lr-bg{fill:none;stroke:var(--line);stroke-width:11}
.land-ring .lr-fg{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.land-ring .lr-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.land-ring .lr-txt b{font-size:30px;font-weight:800;font-family:monospace;line-height:1}
.land-ring .lr-txt span{font-size:10.5px;color:var(--muted);margin-top:3px}
.land-detail{flex:1;min-width:220px}
.land-level{display:inline-block;font-size:12px;font-weight:800;padding:5px 13px;border-radius:8px;margin-bottom:10px}
.land-desc{font-size:12.5px;color:var(--ink-2);line-height:1.8}
.land-factors{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.land-factor{display:flex;align-items:center;gap:10px;font-size:11.5px}
.land-factor .lf-name{width:72px;color:var(--muted);flex:none}
.land-factor .lf-bar{flex:1;height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden}

.land-factor .lf-val{width:34px;text-align:right;font-family:monospace;font-weight:700;color:var(--ink-2)}

.report-panel h4{font-size:14px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.bar-row{margin-bottom:13px}

.bar-row .br-top span{color:var(--muted);font-family:monospace}
.bar-track{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden}

.radar-wrap{text-align:center}
.radar-wrap canvas{max-width:100%}
.weak-list{display:flex;flex-direction:column;gap:9px}

.weak-item .wi-rate{font-family:monospace;font-weight:800;font-size:13px}
.advice-box{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.9;color:var(--ink-2)}

  .exam-bar{top:0}
  .land-main{gap:16px}
}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <h1>📝 单元练习</h1>
      <div class="sub">学几课 · 综合练一次</div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-links">
        <a href="index.html">📚 题库刷题系统</a>
        <a href="bank.html">📖 题目大全</a>
      </div>
      <span>进度存本机 · 刷新不丢</span>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="crumb" id="crumb">单元练习 / <b>选择单元</b></div>
      <button class="btn ghost" id="wrongBtn" style="padding:8px 14px">📕 错题 <span id="wrongN">0</span></button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script src="bank-data.js"></script>
<script>
const QS = (window.BANK_DATA && window.BANK_DATA.questions) || [];
const META = window.BANK_DATA || {};
const BIG_TYPES = new Set(['简答','论述','辨析','材料分析','教学设计']);
const $=id=>document.getElementById(id);
const S={unit:null, mode:'home', questions:[], answers:{}, bigText:{}, bigGrade:{}, submitted:false, seconds:0, timerId:null};
const STORE_KEY='wb_unit_progress_v1';
const WRONG_KEY='wb_unit_wrong_v1';

function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};}}
function saveStore(){localStorage.setItem(STORE_KEY,JSON.stringify(store));}
let store=loadStore();
function loadWrong(){try{return JSON.parse(localStorage.getItem(WRONG_KEY))||[];}catch(e){return [];}}
let wrongBook=loadWrong();
function saveWrong(){localStorage.setItem(WRONG_KEY,JSON.stringify(wrongBook));}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qImgHtml(q,small){
  const src=(q&&q.img)||'';
  if(!src)return '';
  const cap=(q&&q.chart)?'图表题 · 请结合图示作答':'题图';
  return `<figure class="q-fig${small?' sm':''}"><img src="${src}" alt="${cap}" loading="lazy" onclick="qFigZoom(this.src)" onerror="this.parentNode.style.display='none'"><figcaption>${cap}　<span>点击放大</span></figcaption></figure>`;
}
function qFigZoom(src){
  let box=document.getElementById('qFigLight');
  if(!box){box=document.createElement('div');box.id='qFigLight';box.className='q-fig-light';box.onclick=()=>box.classList.remove('show');box.innerHTML='<img>';document.body.appendChild(box);}
  box.querySelector('img').src=src;box.classList.add('show');
}

// ===== 两级练习集 =====
// 一级：细分复习练（2-3个知识点一组，学完几课就练）
const SUB_UNITS=[{"name":"教育本质与目的","subject":"教综","kps":["教育的本质·起源与属性","教育目的与教育制度"],"icon":"🎯","cls":"uc-jz"},{"name":"课程·教学·德育","subject":"教综","kps":["课程·类型与理论与设计","教学·原则方法与过程","德育与班主任工作"],"icon":"📖","cls":"uc-jz"},{"name":"心理学与学习心理","subject":"教综","kps":["心理学·注意感知记忆思维个性","教育心理学·学习理论动机迁移策略"],"icon":"🧠","cls":"uc-jz"},{"name":"法规·师德·新课改","subject":"教综","kps":["教育法律法规·师德·新课改"],"icon":"⚖️","cls":"uc-jz"},{"name":"先秦与秦汉","subject":"历史学科","kps":["中华文明起源与早期国家","春秋战国","秦汉"],"icon":"🏯","cls":"uc-ls"},{"name":"魏晋南北朝与隋唐","subject":"历史学科","kps":["三国两晋南北朝","隋唐"],"icon":"🏛️","cls":"uc-ls"},{"name":"宋元与明清","subject":"历史学科","kps":["宋元","明清"],"icon":"🏰","cls":"uc-ls"},{"name":"鸦片战争与近代化探索","subject":"历史学科","kps":["鸦片战争与第二次鸦片战争","太平天国与洋务运动","甲午中日战争与戊戌变法"],"icon":"⚔️","cls":"uc-ls"},{"name":"辛亥革命与新文化运动","subject":"历史学科","kps":["八国联军侵华与辛亥革命","新文化运动与五四运动"],"icon":"🚩","cls":"uc-ls"},{"name":"新民主主义革命与抗战","subject":"历史学科","kps":["中国共产党成立与新民主主义革命","抗日战争与人民解放战争"],"icon":"⭐","cls":"uc-ls"},{"name":"新中国成立与改革开放","subject":"历史学科","kps":["新中国成立与改革开放"],"icon":"🌆","cls":"uc-ls"},{"name":"古代文明与中古世界","subject":"历史学科","kps":["古代文明起源与中古世界"],"icon":"🏺","cls":"uc-ls"},{"name":"近代西方崛起","subject":"历史学科","kps":["新航路开辟与早期殖民扩张","文艺复兴·宗教改革·启蒙运动","英美法资产阶级革命"],"icon":"⛵","cls":"uc-ls"},{"name":"工业革命与国际共运","subject":"历史学科","kps":["两次工业革命","马克思主义的诞生与国际工人运动"],"icon":"⚙️","cls":"uc-ls"},{"name":"两次世界大战与冷战","subject":"历史学科","kps":["两次世界大战·国际秩序·冷战全球化"],"icon":"🌍","cls":"uc-ls"}];
// 二级：综合单元练（8个知识模块，大范围巩固）
const UNITS=[
  {name:'教育学基础',subject:'教综',icon:'📘',cls:'uc-jz'},
  {name:'心理学',subject:'教综',icon:'🧠',cls:'uc-jz'},
  {name:'教育心理学',subject:'教综',icon:'💡',cls:'uc-jz'},
  {name:'法律法规与师德',subject:'教综',icon:'⚖️',cls:'uc-jz'},
  {name:'中国古代史',subject:'历史学科',icon:'🏯',cls:'uc-ls'},
  {name:'中国近代史',subject:'历史学科',icon:'🚩',cls:'uc-ls'},
  {name:'中国现代史',subject:'历史学科',icon:'🏛️',cls:'uc-ls'},
  {name:'世界史',subject:'历史学科',icon:'🌍',cls:'uc-ls'},
];
// 为综合单元补齐 kps（该模块下全部知识点）
UNITS.forEach(u=>{u.kps=[...new Set(QS.filter(q=>q.module===u.name).map(q=>q.kp))];u.isBig=true;});
SUB_UNITS.forEach(u=>u.isBig=false);
// 统一索引：按 name 找练习集
const UNIT_MAP={};
[...SUB_UNITS,...UNITS].forEach(u=>UNIT_MAP[u.name]=u);
function getUnit(name){return UNIT_MAP[name]||UNITS[0];}

function unitQuestions(name){
  const u=getUnit(name);
  const kpSet=new Set(u.kps||[]);
  const inUnit = QS.filter(q=>kpSet.has(q.kp));
  const obj = inUnit.filter(q=>!BIG_TYPES.has(q.type));
  const big = inUnit.filter(q=>BIG_TYPES.has(q.type));
  return {obj, big, all:inUnit};
}

function renderSidebar(){
  const nav=$('sbNav');nav.innerHTML='';
  const examBtn=document.createElement('button');
  examBtn.className='nav-item'+(S.mode==='examHome'?' active':'');
  examBtn.innerHTML='<span class="ni-ic" style="background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff">🎓</span><span class="ni-name">考试中心</span><span class="ni-num">3模式</span>';
  examBtn.onclick=()=>{openExamHome();closeSide();};
  nav.appendChild(examBtn);
  const addGroup=(title,arr)=>{
    const g=document.createElement('div');g.className='nav-gtitle';g.textContent=title;nav.appendChild(g);
    arr.forEach(u=>nav.appendChild(navItem(u)));
  };
  addGroup('🔹 细分复习练 · 教综',SUB_UNITS.filter(u=>u.subject==='教综'));
  addGroup('🔹 细分复习练 · 历史',SUB_UNITS.filter(u=>u.subject==='历史学科'));
  addGroup('🔸 综合单元练 · 教综',UNITS.filter(u=>u.subject==='教综'));
  addGroup('🔸 综合单元练 · 历史',UNITS.filter(u=>u.subject==='历史学科'));
  updateStats();
}
function navItem(u){
  const {all}=unitQuestions(u.name);
  const b=document.createElement('button');b.className='nav-item'+(S.unit===u.name&&S.mode!=='home'?' active':'');
  b.innerHTML=`<span class="ni-ic">${u.icon}</span><span class="ni-name">${u.name}</span><span class="ni-num">${all.length}</span>`;
  b.onclick=()=>{openSetup(u.name);closeSide();};
  return b;
}
function updateStats(){$('wrongN').textContent=wrongBook.length;}

function goHome(){stopTimer();S.mode='home';S.unit=null;$('crumb').innerHTML='单元练习 / <b>选择单元</b>';renderSidebar();renderHome();}
function cardHtml(u){
  const {obj,big,all}=unitQuestions(u.name);
  const done=store[u.name];
  const kpCount=(u.kps||[]).length;
  return `<div class="unit-card" onclick="openSetup('${u.name}')">
    <div class="uc-top"><div class="uc-ic ${u.cls}">${u.icon}</div>
      <div><div class="uc-title">${u.name}</div><div class="uc-sub">${u.subject} · ${kpCount} 个知识点${u.isBig?' · 综合':''}</div></div></div>
    <div class="uc-meta"><span>客观题 <b>${obj.length}</b></span><span>大题 <b>${big.length}</b></span><span>合计 <b>${all.length}</b></span></div>
    ${done?`<div style="font-size:11.5px;color:var(--ok);font-weight:700">✓ 上次得分 ${done.score}/${done.total}（${done.rate}分）</div>`:'<div style="font-size:11.5px;color:var(--muted)">尚未练习</div>'}
    <div class="uc-big">${u.isBig?'大范围综合':'含大题·自评'}</div>
    <div class="uc-go">开始练习 →</div>
  </div>`;
}
function renderHome(){
  const bigAll=QS.filter(q=>BIG_TYPES.has(q.type)).length;
  const subCards=SUB_UNITS.map(cardHtml).join('');
  const bigCards=UNITS.map(cardHtml).join('');
  // 考试历史
  let hist='';
  if(examHistory.length){
    hist=`<div class="section-title"><span class="st-line"></span>最近考试成绩</div><div class="exam-history">`+
      examHistory.slice(0,5).map(r=>{
        const cfg=EXAM_TYPES[r.type]||{name:'考试'};
        return `<div class="exam-hist-row"><div class="ehr-score" style="color:${r.score>=80?'var(--ok)':r.score>=60?'var(--brand)':'var(--err)'}">${r.score}</div>
          <div class="ehr-info"><b>${cfg.name}</b><span>客观正确率 ${r.objRate}% · 大题 ${r.bigCount} 道 · 用时 ${fmt(r.seconds||0)}</span></div>
          <div class="ehr-date">${new Date(r.ts).toLocaleDateString('zh-CN')}</div>
          <button class="btn ghost" style="padding:7px 12px" onclick="replayExam('${r.type}')">再考一次</button></div>`;
      }).join('')+`</div>`;
  }
  const modeCard=(key)=>{
    const c=EXAM_TYPES[key];
    return `<div class="exam-mode m-${key}" onclick="startExam('${key}')">
      <div class="em-top"><div class="em-ic">${c.icon}</div><div><div class="em-name">${c.name}</div><div class="em-tag">${key==='small'?'随时检测':key==='big'?'阶段检验':'全真模拟 · 含上岸概率'}</div></div></div>
      <div class="em-desc">${c.desc}</div>
      <div class="em-meta"><span>📝 ${c.count} 客观题</span><span>⏱ ${c.minutes} 分钟</span>${c.bigCount?`<span>✍️ ${c.bigCount} 大题</span>`:''}</div>
      <div class="em-go">开始考试 →</div>
    </div>`;
  };
  $('content').innerHTML=`<div class="exam-hero">
      <span class="eh-badge">🎓 依据你的学习进度智能出卷</span>
      <h2>考试中心</h2>
      <p>系统会根据你当前的掌握情况，优先抽取未做与薄弱知识点的真题，越练越精准。三种考试形式：小测验保持手感、单元大考练节奏、全真编制考完整模拟并给出成绩与上岸概率参考。</p>
    </div>
    <div class="exam-modes">${modeCard('small')}${modeCard('big')}${modeCard('real')}</div>
    ${hist}
    <div class="section-title"><span class="st-line"></span>单元练习（按知识点 Systematic 训练）</div>
    <div class="hero" style="background:linear-gradient(135deg,#0f3fa8,#2563eb)">
      <h2>把学过的串起来练</h2>
      <p>两级练习：先做「细分复习练」（2-3个知识点一组），再用「综合单元练」大范围巩固。客观题自动判分，大题对照参考答案自评，错题自动进本。</p>
    </div>
    <div class="section-title"><span class="st-line"></span>第一级 · 细分复习练（学完几课就练）</div>
    <div class="unit-grid">${subCards}</div>
    <div class="section-title"><span class="st-line"></span>第二级 · 综合单元练（大范围巩固）</div>
    <div class="unit-grid">${bigCards}</div>
    <div class="section-title"><span class="st-line"></span>说明</div>
    <div class="setup" style="font-size:13px;color:var(--ink-2);line-height:1.9">
      · 考试卷只从公开可核验真题中抽取，共 ${QS.length} 道题，均保留原始来源链接。<br>
      · 多选题按组合答案精确判分、判断题按 √× 判分；大题对照参考答案自评。<br>
      · 上岸概率是基于本机答题数据的学习参考估算，非官方预测。<br>
      · 题库会随每日定时任务继续增加。
    </div>`;
}
function replayExam(type){startExam(type);}
function openExamHome(){
  stopExamTimer();stopTimer();S.mode='examHome';S.unit=null;
  $('crumb').innerHTML='考试中心 / <b>首页</b>';
  renderSidebar();renderHome();
  window.scrollTo({top:0,behavior:'smooth'});
}

function openSetup(name){
  stopTimer();S.mode='setup';S.unit=name;
  const {obj,big,all}=unitQuestions(name);
  const u=getUnit(name);
  $('crumb').innerHTML=`单元练习 / <b>${name}</b>`;
  renderSidebar();
  let counts=[10,15,20].filter(n=>n<=obj.length);
  if(!counts.length) counts=[Math.max(1,Math.min(obj.length,10))];
  let optsHtml=counts.map((n,i)=>`<label class="opt-row${i===counts.length-1?' sel':''}" data-n="${n}">
      <input type="radio" name="cnt" value="${n}" ${i===counts.length-1?'checked':''}>
      <span class="ot">客观题 ${n} 道${n===20?'（推荐）':''}</span></label>`).join('');
  const kpList=(u.kps||[]).map(k=>`<span style="display:inline-block;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin:0 6px 6px 0">${k}</span>`).join('');
  $('content').innerHTML=`<div class="setup">
    <h3>${u.icon} ${name}</h3>
    <div class="desc">${u.subject} · ${u.isBig?'综合单元':'细分复习'} · 客观题 ${obj.length} 道、大题 ${big.length} 道可练</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">覆盖知识点：</div>
    <div style="margin-bottom:18px">${kpList}</div>
    <div style="font-size:13px;font-weight:800;margin-bottom:10px">本套题量</div>
    ${optsHtml}
    <div style="font-size:12px;color:var(--muted);margin-top:14px">大题（简答/论述/材料分析）会全部包含，写完对照答案自评。</div>
    <div class="setup-actions">
      <button class="btn primary" id="startBtn">开始练习 →</button>
      <button class="btn ghost" onclick="goHome()">返回单元列表</button>
    </div>
  </div>`;
  document.querySelectorAll('.opt-row').forEach(r=>r.onclick=()=>{
    document.querySelectorAll('.opt-row').forEach(x=>x.classList.remove('sel'));
    r.classList.add('sel');r.querySelector('input').checked=true;
  });
  $('startBtn').onclick=()=>{
    const n=+document.querySelector('input[name=cnt]:checked').value;
    startQuiz(name,n);
  };
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startQuiz(name,objCount){
  const {obj,big}=unitQuestions(name);
  const picked=[...shuffle(obj).slice(0,objCount),...big];
  S.questions=picked;S.answers={};S.bigText={};S.bigGrade={};S.submitted=false;S.seconds=0;
  S.mode='quiz';$('crumb').innerHTML=`单元练习 / <b>${name}</b> / 答题中`;
  renderSidebar();renderQuiz();startTimer();
}

function renderQuiz(){
  const u=getUnit(S.unit);
  let h=`<div class="quiz-head"><div class="qh-title">${u.icon} ${S.unit} · ${u.isBig?'综合练习':'复习练'}</div><div class="timer" id="timer">⏱ 00:00</div></div>`;
  S.questions.forEach((q,i)=>{
    const isBig=BIG_TYPES.has(q.type);
    h+=`<div class="q-card" id="qc${i}">
      <div class="q-top"><span class="q-num">${i+1}</span><span class="q-type${isBig?' big':''}">${esc(q.type||'单选')}</span><div class="q-text">${esc(q.q)}</div>${qImgHtml(q)}</div>`;
    if(isBig){
      h+=`<textarea class="big-answer" id="ba${i}" placeholder="在这里写下你的答案（分点作答更清晰）…" oninput="S.bigText[${i}]=this.value">${esc(S.bigText[i]||'')}</textarea>
        <div class="big-hint">💡 主观题请写完后点下方「显示参考答案」，对照评分要点自评</div>`;
    }else if(q.type==='判断'){
      h+=`<div class="opts" style="flex-direction:row">
        <div class="opt${S.answers[i]==='√'?' sel':''}" onclick="pickOptJudge(${i},'√',this)" style="flex:1;justify-content:center">√ 正确</div>
        <div class="opt${S.answers[i]==='×'?' sel':''}" onclick="pickOptJudge(${i},'×',this)" style="flex:1;justify-content:center">× 错误</div></div>`;
    }else{
      const multi=q.type==='多选';
      h+=`<div class="opts">`;
      String(q.opts||'').split(/[；;]/).forEach(o=>{
        o=o.trim();if(!o)return;
        const m=o.match(/^([A-D])[.．、]\s*(.*)$/);const key=m?m[1]:'';
        const sel=multi&&(S.answers[i]||'').includes(key);
        h+=`<div class="opt${sel?' sel':''}" data-i="${i}" data-key="${key}" onclick="pickOpt(${i},'${key}',this)">${esc(o)}</div>`;
      });
      h+=`</div>`+(multi?`<div class="big-hint">多选题：可多选，交卷后按答案完全一致判分</div>`:'');
    }
    h+=`<div id="ans${i}"></div></div>`;
  });
  h+=`<div class="submit-bar"><div class="info">共 <b>${S.questions.length}</b> 题 · 客观题 <b>${S.questions.filter(q=>!BIG_TYPES.has(q.type)).length}</b> · 大题 <b>${S.questions.filter(q=>BIG_TYPES.has(q.type)).length}</b></div>
    <button class="btn primary" id="submitBtn">交卷 · 查看成绩与解析</button></div>`;
  $('content').innerHTML=h;
  $('submitBtn').onclick=submitQuiz;
  updateTimerDisplay();
}
function pickOpt(i,key,el){
  if(S.submitted)return;
  const q=S.questions[i];
  if(q&&q.type==='多选'){
    let cur=S.answers[i]||'';
    if(cur.includes(key))cur=cur.replace(key,'');else cur=(cur+key).split('').sort().join('');
    S.answers[i]=cur;el.classList.toggle('sel',cur.includes(key));
  }else{
    S.answers[i]=key;
    el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===el));
  }
}
function pickOptJudge(i,key,el){
  if(S.submitted)return;S.answers[i]=key;
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===el));
}
function judgeAns(q,your){
  const ans=String(q.ans||'').trim().replace(/\s/g,'').toUpperCase();
  const y=String(your||'').toUpperCase();
  if(q.type==='多选'){const a=ans.split('').sort().join(''),b=y.split('').sort().join('');return a.length>0&&a===b;}
  if(q.type==='判断'){
    const n=x=>(x==='√'||x==='对'||x==='正确'||x==='T'||x==='TRUE')?'√':((x==='×'||x==='错'||x==='错误'||x==='F'||x==='FALSE')?'×':x);
    return y!==''&&n(y)===n(ans);
  }
  return y!==''&&y===ans.charAt(0);
}

function submitQuiz(){
  const left=S.questions.filter((q,i)=>!BIG_TYPES.has(q.type)&&!S.answers[i]).length;
  const bigEmpty=S.questions.filter((q,i)=>BIG_TYPES.has(q.type)&&!String(S.bigText[i]||'').trim()).length;
  let msg='';
  if(left) msg+=`还有 ${left} 道客观题未作答（记为错误）。`;
  if(bigEmpty) msg+=`${bigEmpty} 道大题未作答。`;
  if(left||bigEmpty){if(!confirm(msg+'\n确定交卷吗？'))return;}
  doSubmit();
}
function doSubmit(){
  stopTimer();S.submitted=true;
  const obj=S.questions.map((q,i)=>({q,i,isBig:BIG_TYPES.has(q.type)})).filter(x=>!x.isBig);
  let right=0;const newWrong=[];
  obj.forEach(({q,i})=>{
    const ok=judgeAns(q,S.answers[i]);
    if(ok)right++;else newWrong.push({qi:i,type:'objective'});
  });
  // 大题自评
  S.questions.forEach((q,i)=>{
    if(BIG_TYPES.has(q.type)){
      const g=S.bigGrade[i];
      if(g===3||g===undefined) newWrong.push({qi:i,type:'big',grade:g});
    }
  });
  const objTotal=obj.length;
  const rate=objTotal?Math.round(right/objTotal*100):0;
  // 存进度
  store[S.unit]={score:right,total:objTotal,rate,seconds:S.seconds,date:Date.now()};saveStore();
  // 错题入本（去重）
  newWrong.forEach(w=>{
    const q=S.questions[w.qi];
    const k=norm(q.q);
    if(!wrongBook.some(x=>norm(x.q)===k)){
      wrongBook.push({q:k,qtext:q.q,type:q.type,unit:S.unit,answer:q.ans,ref:q.ana,qi:w.qi,grade:w.grade||null});
    }
  });
  saveWrong();updateStats();
  renderResult(right,objTotal,rate,newWrong);
  toast('已交卷 · 错题已收入错题本');
}

// 每题掌握度：0未做 1已做 2已掌握（读主进度）
function qMastery(id){const p=loadMainProg();const v=(p.q||{})[id];return v?(v.s||0):0;}
// 智能出卷：优先未做/薄弱，混入部分已做巩固；同分布梯度
function smartPick(pool,n){
  const arr=[...pool];
  const weight=q=>{
    const m=qMastery(q.id);
    let w = m===0?6 : m===1?3 : 1.2;         // 未做权重最高
    if(String(q.diff)==='3') w*=1.25;         // 挑战题略提权
    if(String(q.diff)==='1') w*=0.8;
    return w;
  };
  const picked=[], used=new Set();
  // 加权无放回抽样
  while(picked.length<n && picked.length<arr.length){
    let total=0;const ws=arr.map((q,i)=>used.has(i)?0:weight(q));
    for(const w of ws)total+=w;
    let r=Math.random()*total, idx=-1;
    for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0){idx=i;break;}}
    if(idx<0)idx=ws.findIndex(w=>w>0);
    if(idx<0)break;
    used.add(idx);picked.push(arr[idx]);
  }
  return picked;
}
// 题型配比（贴近真实教师编考试：单选为主体，含多选、判断，图表题保底）
const TYPE_QUOTA={
  small:{单选:8,多选:2,判断:2,chartMin:1},
  big:{单选:24,多选:6,判断:5,chartMin:2},
  real:{单选:52,多选:16,判断:12,chartMin:3}
};
// 按题型配额抽题：每类独立加权抽样，图表题优先保底纳入
function pickByQuota(pool,quota){
  const chosen=[],used=new Set();
  const byType=t=>pool.filter(q=>(q.type||'单选')===t);
  // 1) 图表题保底（优先未做/薄弱）
  const charts=pool.filter(q=>q.chart);
  if(quota.chartMin>0 && charts.length){
    smartPick(charts,Math.min(quota.chartMin,charts.length)).forEach(q=>{
      if(!used.has(q.id)){used.add(q.id);chosen.push(q);}
    });
  }
  // 2) 按题型配额补齐（扣除已纳入的图表题）
  for(const t of ['单选','多选','判断']){
    const need=quota[t]||0;
    if(need<=0)continue;
    const already=chosen.filter(q=>(q.type||'单选')===t).length;
    const take=Math.max(0,need-already);
    const cand=byType(t).filter(q=>!used.has(q.id));
    smartPick(cand,take).forEach(q=>{if(!used.has(q.id)){used.add(q.id);chosen.push(q);}});
  }
  // 3) 若某题型不足，用剩余客观题补齐总数
  const totalNeed=['单选','多选','判断'].reduce((a,t)=>a+(quota[t]||0),0);
  if(chosen.length<totalNeed){
    const rest=pool.filter(q=>!used.has(q.id));
    smartPick(rest,totalNeed-chosen.length).forEach(q=>{if(!used.has(q.id)){used.add(q.id);chosen.push(q);}});
  }
  return chosen;
}
function examObjPool(type){
  const pool=QS.filter(q=>!BIG_TYPES.has(q.type));
  const quota=TYPE_QUOTA[type]||TYPE_QUOTA.small;
  if(type==='real'){
    // 全真：教综/历史按 55:45 分区，各自内部按题型配比
    const ls=pool.filter(q=>/中华|春秋|战国|秦汉|三国|两晋|南北朝|隋唐|宋元|明清|鸦片|太平|洋务|甲午|戊戌|八国|辛亥|新文化|五四|共产党|新民主主义|抗日|解放战争|新中国|改革开放|新航路|文艺复兴|宗教改革|启蒙|资产阶级革命|工业革命|马克思主义|世界大战|冷战|古埃及|古希腊|古罗马|中世纪|文明起源|世界史|古代文明/.test(q.kp||''));
    const jz=pool.filter(q=>!ls.includes(q));
    // 教综44(单选29/多选9/判断6,图表3)、历史36(单选23/多选7/判断6)
    const qA=pickByQuota(jz,{单选:29,多选:9,判断:6,chartMin:3});
    const qB=pickByQuota(ls,{单选:23,多选:7,判断:6,chartMin:0});
    let res=[...qA,...qB];
    if(res.length<80){const used=new Set(res.map(q=>q.id));const rest=pool.filter(q=>!used.has(q.id));res=res.concat(shuffle(rest).slice(0,80-res.length));}
    return shuffle(res);
  }
  return pickByQuota(pool,quota);
}

  });
  h+=`<div class="submit-bar"><div class="info">已答 <b id="answeredCount">${answeredCount()}</b> / ${E.questions.length} · 未答将记为错</div>
    <button class="btn primary" id="examSubmitBtn">交卷 · 查看成绩与报告</button></div>`;

function pickExamOpt(i,key,el){

function answeredCount(){

function submitExam(auto){
  if(E.submitted)return;
  const un=answeredCount();
  if(!auto && un<E.questions.length){
    if(!confirm(`还有 ${E.questions.length-un} 题未作答（客观题记错、大题记未作答）。\n确定交卷吗？`))return;

// 判分：客观题正确比对（多选组合精确匹配，判断 √×），大题按自评折算
function doSubmitExam(){
  stopExamTimer();E.submitted=true;
  const objIdx=[],bigIdx=[];
  E.questions.forEach((q,i)=>{(BIG_TYPES.has(q.type)?bigIdx:objIdx).push(i);});
  let right=0;const records=[];const kpStat={};
  objIdx.forEach(i=>{
    const q=E.questions[i];
    const ans=String(q.ans||'').trim().replace(/\s/g,'').toUpperCase();
    const your=String(E.answers[i]||'').toUpperCase();
    let ok=false;
    if(q.type==='多选'){
      const a=ans.split('').sort().join(''),b=your.split('').sort().join('');
      ok=a.length>0&&a===b;
    }else if(q.type==='判断'){
      const norm=x=>(x==='√'||x==='对'||x==='正确'||x==='T'||x==='TRUE')?'√':((x==='×'||x==='错'||x==='错误'||x==='F'||x==='FALSE')?'×':x);
      ok=norm(your)===norm(ans)&&your!=='';
    }else{
      ok=your!==''&&your===ans.charAt(0);
    }
    if(ok)right++;
    const kp=E.kpOf[i];
    if(!kpStat[kp])kpStat[kp]={r:0,t:0};
    kpStat[kp].t++;if(ok)kpStat[kp].r++;
    records.push({i,q,type:q.type,diff:String(q.diff||'2'),kp,ok,your,ans,isBig:false});
  });
  // 大题：自评 g=1掌握→满分 g=2模糊→半分 g=3不会→0 未作答→0
  bigIdx.forEach(i=>{
    const q=E.questions[i];const g=E.bigGrade[i];
    const score=g===1?1:(g===2?0.5:0);
    const kp=E.kpOf[i];
    if(!kpStat[kp])kpStat[kp]={r:0,t:0};
    kpStat[kp].t+=1;kpStat[kp].r+=score;
    records.push({i,q,type:q.type,diff:String(q.diff||'2'),kp,ok:g===1,your:E.bigText[i]||'',ans:q.ans,isBig:true,grade:g,score});
  });
  const objTotal=objIdx.length;
  const objRate=objTotal?Math.round(right/objTotal*100):0;
  // 总分：客观题折算 + 大题自评折算，各占权重（大考/全真：客观70 + 大题30；小考全客观）
  let totalScore=objRate;
  if(bigIdx.length){
    let bigScore=0;bigIdx.forEach(i=>bigScore+=(E.bigGrade[i]===1?1:E.bigGrade[i]===2?0.5:0));
    const bigRate=bigScore/bigIdx.length*100;
    totalScore=Math.round(objRate*0.75+bigRate*0.25);
  }
  // 大题未自评的，提示先自评（在报告页里给按钮）
  const rec={type:E.type,score:totalScore,objRate,right,objTotal,bigCount:bigIdx.length,
    seconds:E.seconds,ts:Date.now(),kpStat,questions:records.map(r=>({q:r.q.q,kp:r.kp,type:r.type,ok:r.ok,diff:r.diff}))};
  examHistory.unshift(rec);if(examHistory.length>40)examHistory=examHistory.slice(0,40);
  saveExamHistory();
  // 客观错题入错题本
  records.filter(r=>!r.isBig&&!r.ok).forEach(r=>{
    const k=norm(r.q.q);
    if(!wrongBook.some(x=>norm(x.q)===k)){
      wrongBook.push({q:k,qtext:r.q.q,type:r.q.type,unit:'考试·'+EXAM_TYPES[E.type].name,answer:r.q.ans,ref:r.q.ana,url:r.q.url||'',site:r.q.site||''});
    }
  });
  saveWrong();updateStats();
  renderExamReport(rec,records,kpStat);
  toast('考试完成 · 报告已生成');
}

// 上岸概率：进度完成度30% + 本次正确率35% + 知识点掌握广度20% + 历史趋势15%
function calcLanding(rec){
  const mainProg=loadMainProg();
  const total=Object.keys(DATA_QS_MAP).length||3616;
  let done=0,mastered=0;
  for(const id in (mainProg.q||{})){const v=mainProg.q[id];if(v.s>=1)done++;if(v.s===2)mastered++;}
  const progressRate=Math.min(100,Math.round(done/total*100));       // 进度完成度
  const masteryRate=Math.min(100,Math.round(mastered/total*100));    // 掌握广度
  const acc=rec.objRate;                                              // 本次正确率
  // 历史趋势：最近3次平均分
  let trend=acc;
  if(examHistory.length>1){
    const recent=examHistory.slice(0,3);
    trend=Math.round(recent.reduce((a,b)=>a+b.score,0)/recent.length);
  }
  const prob=Math.round(progressRate*0.30+acc*0.35+masteryRate*0.20+trend*0.15);
  let level,cls,desc;
  if(prob>=80){level='上岸稳了';cls='good';desc='进度、正确率与掌握度都很扎实，按这个节奏坚持到最后，上岸希望很大。';}
  else if(prob>=65){level='很有希望';cls='mid';desc='整体表现不错，把薄弱知识点和错题补一补，竞争力还能再上一个台阶。';}
  else if(prob>=45){level='临界追赶';cls='warn';desc='已有一定基础，但正确率或进度还差口气。盯紧高频考点、加大真题量，机会就在眼前。';}
  else{level='仍需努力';cls='bad';desc='现在开始完全来得及。先把计划过一遍、错题吃透，正确率上来后概率会明显改善。';}
  return {prob,progressRate,masteryRate,acc,trend,level,cls,desc};
}
// 题库 id 映射（用于主进度分母），从 QS 构建
const DATA_QS_MAP=(function(){const m={};QS.forEach(q=>m[q.id]=1);return m;})();

function renderExamReport(rec,records,kpStat){

  h+=`<div class="land-card">
    <h3>🎯 上岸概率参考</h3>
    <div class="lc-sub">综合你的学习进度、本次正确率、知识点掌握广度与历史趋势估算</div>
    <div class="land-main">
      <div class="land-ring"><svg viewBox="0 0 120 120">

      </svg><div class="lr-txt" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <b style="color:${lcolor}">${land.prob}%</b><span>上岸概率</span></div></div>
      <div class="land-detail">
        <div class="land-level" style="background:${lcolor};color:#fff">${land.level}</div>
        <div class="land-desc">${land.desc}</div>
        <div class="land-factors">

          <div class="land-factor"><span class="lf-name">本次正确</span><span class="lf-bar"><i style="width:${land.acc}%"></i></span><span class="lf-val">${land.acc}%</span></div>
          <div class="land-factor"><span class="lf-name">掌握广度</span><span class="lf-bar"><i style="width:${land.masteryRate}%"></i></span><span class="lf-val">${land.masteryRate}%</span></div>
          <div class="land-factor"><span class="lf-name">成绩趋势</span><span class="lf-bar"><i style="width:${land.trend}%"></i></span><span class="lf-val">${land.trend}%</span></div>
        </div>
      </div>
    </div>
    <div class="land-disclaimer">⚠️ 该概率是基于本机答题数据的学习参考估算，非官方或真实录取预测，仅供你了解复习状态、调整节奏使用。</div>
  </div>`;
  // 报告图表：知识点正确率 + 题型 + 难度
  const kpArr=Object.keys(kpStat).map(k=>({k,...kpStat[k],rate:Math.round(kpStat[k].r/kpStat[k].t*100)})).sort((a,b)=>a.rate-b.rate);
  const typeStat={};records.filter(r=>!r.isBig).forEach(r=>{if(!typeStat[r.type])typeStat[r.type]={r:0,t:0};typeStat[r.type].t++;if(r.ok)typeStat[r.type].r++;});
  const diffStat={'1':{r:0,t:0},'2':{r:0,t:0},'3':{r:0,t:0}};records.filter(r=>!r.isBig).forEach(r=>{const d=diffStat[r.diff]||diffStat['2'];d.t++;if(r.ok)d.r++;});
  h+=`<div class="section-title"><span class="st-line"></span>多维分析</div><div class="report-grid">`;
  // 知识点
  h+=`<div class="report-panel"><h4>📊 知识点正确率</h4>`;
  if(kpArr.length===0)h+='<div style="font-size:12px;color:var(--muted)">暂无数据</div>';
  kpArr.slice(0,8).forEach(o=>{
    const col=o.rate>=80?'var(--ok)':o.rate>=60?'var(--brand)':'var(--err)';
    h+=`<div class="bar-row"><div class="br-top"><b>${esc(o.k.replace(/（第.*?周）/,''))}</b><span>${o.rate}% (${o.r}/${o.t})</span></div>

    });
    h+=`</div>`;
  }
  // 逐题解析
  h+=`<div class="section-title"><span class="st-line"></span>逐题解析</div>`;
  records.forEach(r=>{
    const q=r.q;const isBig=r.isBig;
    h+=`<div class="q-card"><div class="q-top"><span class="q-num" style="background:${isBig?'var(--warn)':(r.ok?'var(--ok)':'var(--err)')}">${r.i+1}</span>

      </div></div>`;
  });
  h+=`<div class="setup-actions" style="margin-bottom:40px">
    <button class="btn primary" onclick="openExamHome()">返回考试中心</button>
    <button class="btn ghost" onclick="openWrong()">查看错题本</button></div>`;
  $('content').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}
